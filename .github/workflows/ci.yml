name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate release version contract
        run: npm run test:version
      - name: Validate baseline validator contract
        run: npm run test:baseline-validator
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npm run test:web
      - name: Validate horizontal agency observability
        run: node scripts/validate-horizontal-agency-baseline.mjs
      - name: Preserve first horizontal agency baseline
        run: |
          cp test-results/horizontal-agency-baseline.json "$RUNNER_TEMP/horizontal-agency-baseline-first.json"
          cp test-results/horizontal-agency-summary.md "$RUNNER_TEMP/horizontal-agency-summary-first.md"
      - name: Replay horizontal agency baseline
        run: npx playwright test tests/horizontal-agency.spec.js --workers=1
      - name: Validate replayed horizontal agency baseline
        run: node scripts/validate-horizontal-agency-baseline.mjs
      - name: Prove horizontal agency baseline reproducibility
        run: |
          if ! cmp -s "$RUNNER_TEMP/horizontal-agency-baseline-first.json" test-results/horizontal-agency-baseline.json; then
            echo "Horizontal agency JSON drifted between identical runs." >&2
            diff -u "$RUNNER_TEMP/horizontal-agency-baseline-first.json" test-results/horizontal-agency-baseline.json || true
            exit 1
          fi
          if ! cmp -s "$RUNNER_TEMP/horizontal-agency-summary-first.md" test-results/horizontal-agency-summary.md; then
            echo "Horizontal agency Markdown summary drifted between identical runs." >&2
            diff -u "$RUNNER_TEMP/horizontal-agency-summary-first.md" test-results/horizontal-agency-summary.md || true
            exit 1
          fi
          echo "Horizontal agency baseline reproduced exactly across two runs."
      - name: Publish horizontal agency summary
        if: always()
        run: |
          if [[ -f test-results/horizontal-agency-summary.md ]]; then
            cat test-results/horizontal-agency-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Horizontal agency baseline" >> "$GITHUB_STEP_SUMMARY"
            echo "Baseline artifact was not produced in this run." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload horizontal agency baseline
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: horizontal-agency-baseline
          path: |
            test-results/horizontal-agency-baseline.json
            test-results/horizontal-agency-summary.md
          if-no-files-found: error

  android:
    name: Android TV validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Test, lint and build APKs
        working-directory: android-tv
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug lintRelease packageDebugApk packageReleaseApk
      - name: Verify packaged APKs are premium and offline
        working-directory: android-tv
        run: |
          chmod +x tools/Verify-Apk.sh
          ./tools/Verify-Apk.sh
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-tv-apks
          path: |
            android-tv/dist/travessia-canarinho-tv-debug.apk
            android-tv/dist/travessia-canarinho-tv-release-unsigned.apk
          if-no-files-found: ignore
